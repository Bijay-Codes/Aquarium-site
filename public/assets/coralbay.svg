           C 38 42, 43 44, 49 46
           C 46 41, 42 38, 38 37
           C 42 33, 48 32, 54 34
           C 49 26, 40 20, 32 20 Z"
        fill="#0b1220" opacity="0.92"/>

  <!-- horizon wave -->
  <path d="M4 44 C 14 40, 22 48, 32 44 C 42 40, 50 48, 60 44 L60 60 L4 60 Z"
